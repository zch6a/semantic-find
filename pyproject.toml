[project]
name = "semantic-find"
version = "0.1.0"
description = "Search your files by what they mean, offline: hybrid keyword and embedding search for notes, documents and code, in Chinese, English and 100 other languages."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tokenizers>=0.15"]
keywords = ["semantic-search", "search", "embeddings", "offline", "local-first", "grep", "bm25", "model2vec", "rag", "chinese"]

[project.urls]
Homepage = "https://github.com/zch6a/semantic-find"
Issues = "https://github.com/zch6a/semantic-find/issues"

[project.optional-dependencies]
pdf = ["pypdf>=4"]

[project.scripts]
sfind = "semantic_find.cli:main"
semantic-find = "semantic_find.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_find"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["semantic_find"]
